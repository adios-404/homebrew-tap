name: Audit

# Every change to the cask — including the bump pull requests tracklaude's release
# workflow opens — must pass Homebrew's own style and audit before it is merged.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Why a symlink: `brew audit` only accepts casks from a tap, and linking the
      # checkout into place audits exactly the commit under review.
      - name: Tap this checkout
        run: |
          taps="$(brew --repository)/Library/Taps/adios-404"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"

      - name: Style
        run: brew style adios-404/tap

      # `--online` also fetches the cask's url and homepage, so a bump that names a
      # Release which does not exist (or is not public) fails here, before merge.
      # Why the token: `--online` calls the GitHub API, and unauthenticated calls share the
      # runner IP's 60 per hour — a bump PR failed on that once (2026-10-03), not on the cask.
      - name: Audit
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew audit --cask --strict --online adios-404/tap/tracklaude
